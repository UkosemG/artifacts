<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bria Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Bria's internal feed of dashboards and facts, with Claude alongside the data." />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Versioned: this path served a different stylesheet on the old site, so a bare
       ./style.css comes back from cache. Bump ?v= whenever the CSS changes shape. -->
  <link rel="stylesheet" href="./style.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%232E2930'/><text x='16' y='22' font-family='sans-serif' font-size='14' font-weight='600' fill='%23FEFCFD' text-anchor='middle'>B</text></svg>" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="bg-wash" aria-hidden="true"></div>

  <!-- Sign-in gate. Variants driven by data-variant: signin | not-configured | wrong-domain -->
  <div id="gate" class="gate" data-variant="signin">
    <section class="gate-card">
      <div class="brand-mark" aria-hidden="true">B</div>
      <p class="eyebrow">Bria</p>
      <h1 class="gate-title">Feed</h1>
      <p class="lede" id="gate-lede">
        Dashboards and the facts behind them, in one place — with Claude next to the data.
      </p>

      <div id="gsi-button" class="gsi-button"></div>

      <p class="gate-note" id="gate-note" hidden></p>

      <button type="button" class="btn btn--ghost" id="gate-retry" hidden>Use a different account</button>

      <p class="gate-fineprint">Bria Google accounts only.</p>
    </section>
  </div>

  <!-- Main app -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark brand-mark--sm" aria-hidden="true">B</span>
        <span class="topbar-title">Feed</span>
      </div>
      <div class="topbar-actions">
        <span class="topbar-user" id="topbar-user"></span>
        <button type="button" class="avatar" id="signout-btn" title="Sign out" aria-label="Sign out"></button>
      </div>
    </header>

    <nav class="stories" id="stories" aria-label="Channels"></nav>

    <!-- Grid is the index, reel is the read. Same posts, two densities. -->
    <div class="view-tabs" id="view-tabs" role="group" aria-label="View">
      <button type="button" class="view-tab" id="tab-grid" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
        </svg>
        Grid
      </button>
      <button type="button" class="view-tab" id="tab-reel" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <path d="M10.6 9.4 15 12l-4.4 2.6z" fill="currentColor" stroke-linejoin="round" />
        </svg>
        Reel
      </button>
    </div>

    <!-- Altitude. Channel says what a post is about; this says how far down it
         reaches, so an IC can filter to the things that are actually theirs. -->
    <nav class="levels" id="levels" aria-label="Level"></nav>

    <main class="feed feed--grid" id="feed" aria-live="polite" aria-busy="true"></main>

    <footer class="app-footer">
      <p>Dashboards open in Claude, where your own access decides what you can see.</p>
    </footer>
  </div>

  <!-- Chat panel -->
  <div class="chat-backdrop" id="chat-backdrop" hidden></div>
  <aside
    class="chat-panel"
    id="chat-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="chat-title"
    hidden
  >
    <header class="chat-header">
      <div class="chat-header-text">
        <p class="eyebrow">Ask Claude</p>
        <h2 class="chat-title" id="chat-title"></h2>
      </div>
      <button type="button" class="icon-btn" id="chat-close" aria-label="Close chat">&times;</button>
    </header>

    <div class="chat-transcript" id="chat-transcript" aria-live="polite"></div>

    <div class="chat-chips" id="chat-chips"></div>

    <form class="chat-composer" id="chat-composer">
      <label class="visually-hidden" for="chat-input">Message Claude</label>
      <textarea
        id="chat-input"
        rows="1"
        placeholder="Ask about this dashboard…"
        autocomplete="off"
      ></textarea>
      <button type="submit" class="btn btn--primary" id="chat-send">Send</button>
    </form>
  </aside>

  <!-- Comments sheet -->
  <div class="sheet-backdrop" id="comments-backdrop" hidden></div>
  <aside
    class="comments-sheet"
    id="comments-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="comments-title"
    hidden
  >
    <header class="comments-header">
      <div class="comments-header-text">
        <p class="eyebrow">Comments</p>
        <h2 class="comments-title" id="comments-title"></h2>
      </div>
      <button type="button" class="icon-btn" id="comments-close" aria-label="Close comments">&times;</button>
    </header>

    <ul class="comment-list" id="comments-list"></ul>

    <form class="comment-form" id="comments-form">
      <label class="visually-hidden" for="comments-input">Add a comment</label>
      <input
        id="comments-input"
        type="text"
        placeholder="Add a comment…"
        maxlength="1000"
        autocomplete="off"
      />
      <button type="submit" class="btn btn--primary" id="comments-send">Post</button>
    </form>
  </aside>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
