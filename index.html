<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Artifacts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A curated list of shared artifacts." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg-wash"></div>
  <main>
    <header class="hero">
      <p class="eyebrow">Shared</p>
      <h1>Artifacts</h1>
      <p class="lede">A running list of the things I've published. Nothing here that isn't meant to be seen.</p>

    <section id="list" class="list" aria-live="polite"></section>

    <section id="empty" class="empty" hidden>
      <p>Nothing published yet — check back soon.</p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
